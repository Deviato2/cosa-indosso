<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15110e">
<meta name="color-scheme" content="dark light">
<title>Cosa Indosso</title>
<style>
@font-face{font-family:"Playfair Display";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/PlayfairDisplay-Regular.woff2) format("woff2")}
:root{--bg:#15110e;--card:#1f1a16;--card2:#2a231d;--line:#3a3028;--text:#f1e8da;--mut:#a89a88;--acc:#d2a76a;--acc-ink:#1b130a;--glow:#2b2119;--hero:#2a2118;--danger:#d9705b;--dline:#5b2f27;--okbg:#2d3b25;--okline:#4d6a3a;--oktx:#cfe8b8;--dotb:rgba(255,255,255,.28);--ov:rgba(0,0,0,.62);--shadow:rgba(0,0,0,.5);color-scheme:dark;--serif:"Playfair Display",Georgia,"Times New Roman",serif}
:root[data-theme=dark][data-season=autunno]{--bg:#15110e;--card:#1f1a16;--card2:#2a231d;--line:#3a3028;--text:#f1e8da;--mut:#a89a88;--acc:#d2a76a;--acc-ink:#1b130a;--glow:#2b2119;--hero:#2a2118;--danger:#d9705b;--dline:#5b2f27;--okbg:#2d3b25;--okline:#4d6a3a;--oktx:#cfe8b8;--dotb:rgba(255,255,255,.28);--ov:rgba(0,0,0,.62);--shadow:rgba(0,0,0,.5);color-scheme:dark}
:root[data-theme=dark][data-season=inverno]{--bg:#0f1318;--card:#171d25;--card2:#202833;--line:#2f3a47;--text:#e8eef5;--mut:#94a3b3;--acc:#8fb4d9;--acc-ink:#0b1520;--glow:#1a2430;--hero:#1c2733;--danger:#d9705b;--dline:#5b2f27;--okbg:#2d3b25;--okline:#4d6a3a;--oktx:#cfe8b8;--dotb:rgba(255,255,255,.28);--ov:rgba(0,0,0,.62);--shadow:rgba(0,0,0,.5);color-scheme:dark}
:root[data-theme=dark][data-season=primavera]{--bg:#12150f;--card:#1a2016;--card2:#232b1e;--line:#333d2b;--text:#edf1e4;--mut:#9fab8f;--acc:#a8c28a;--acc-ink:#131a0c;--glow:#1d2617;--hero:#222b1b;--danger:#d9705b;--dline:#5b2f27;--okbg:#2d3b25;--okline:#4d6a3a;--oktx:#cfe8b8;--dotb:rgba(255,255,255,.28);--ov:rgba(0,0,0,.62);--shadow:rgba(0,0,0,.5);color-scheme:dark}
:root[data-theme=dark][data-season=estate]{--bg:#0e1517;--card:#162124;--card2:#1e2c30;--line:#2b3d42;--text:#e6f1f0;--mut:#8fa9a8;--acc:#6fc3b8;--acc-ink:#06201c;--glow:#15272a;--hero:#19302f;--danger:#d9705b;--dline:#5b2f27;--okbg:#2d3b25;--okline:#4d6a3a;--oktx:#cfe8b8;--dotb:rgba(255,255,255,.28);--ov:rgba(0,0,0,.62);--shadow:rgba(0,0,0,.5);color-scheme:dark}
:root[data-theme=light][data-season=autunno]{--bg:#f6efe4;--card:#fffaf1;--card2:#efe4d3;--line:#dccdb6;--text:#2a2118;--mut:#7a6a58;--acc:#a9742b;--acc-ink:#fff8ee;--glow:#fbf3e6;--hero:#f7ead3;--danger:#b24a36;--dline:#e3b5a9;--okbg:#e3f0d6;--okline:#9cc27c;--oktx:#35591f;--dotb:rgba(0,0,0,.2);--ov:rgba(20,15,10,.45);--shadow:rgba(60,40,20,.25);color-scheme:light}
:root[data-theme=light][data-season=inverno]{--bg:#eef2f7;--card:#fbfdff;--card2:#e1e8f0;--line:#cbd5e1;--text:#1a2430;--mut:#5c6b7c;--acc:#3c6ea3;--acc-ink:#ffffff;--glow:#f4f7fb;--hero:#e4edf7;--danger:#b24a36;--dline:#e3b5a9;--okbg:#e3f0d6;--okline:#9cc27c;--oktx:#35591f;--dotb:rgba(0,0,0,.2);--ov:rgba(20,15,10,.45);--shadow:rgba(60,40,20,.25);color-scheme:light}
:root[data-theme=light][data-season=primavera]{--bg:#f1f4ea;--card:#fcfdf8;--card2:#e5ebd9;--line:#cfd8bf;--text:#1f2916;--mut:#667558;--acc:#5f8a3c;--acc-ink:#ffffff;--glow:#f6f8ef;--hero:#e8efd9;--danger:#b24a36;--dline:#e3b5a9;--okbg:#e3f0d6;--okline:#9cc27c;--oktx:#35591f;--dotb:rgba(0,0,0,.2);--ov:rgba(20,15,10,.45);--shadow:rgba(60,40,20,.25);color-scheme:light}
:root[data-theme=light][data-season=estate]{--bg:#eaf4f3;--card:#fafefd;--card2:#d9ebe9;--line:#bcd6d3;--text:#11292a;--mut:#547472;--acc:#1f8a80;--acc-ink:#ffffff;--glow:#f1f9f8;--hero:#daf0ed;--danger:#b24a36;--dline:#e3b5a9;--okbg:#e3f0d6;--okline:#9cc27c;--oktx:#35591f;--dotb:rgba(0,0,0,.2);--ov:rgba(20,15,10,.45);--shadow:rgba(60,40,20,.25);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:radial-gradient(120% 55% at 50% -8%,var(--glow) 0%,var(--bg) 60%) fixed;color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px calc(100px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
h1{font-family:var(--serif);font-weight:400;font-size:30px;letter-spacing:.01em;margin:0;line-height:1.05}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:38px;font-size:14px;color:var(--text)}
.chip.on{background:var(--card2);border-color:var(--acc);color:var(--acc)}
.wrapchips{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;min-height:48px;padding:10px 14px;font-weight:600;color:var(--text)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--dline);background:transparent}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14px}
.btn.worn{background:var(--okbg);border-color:var(--okline);color:var(--oktx)}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card.hero{border-color:var(--acc);background:linear-gradient(180deg,var(--hero) 0%,var(--card) 100%)}
.card.big{padding:20px 18px}
.herotag{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);font-weight:700;margin-bottom:8px}
.name{font-family:var(--serif);font-size:25px;line-height:1.12}
.card.big .name{font-size:27px;line-height:1.1}
.occ{color:var(--mut);font-size:13.5px;margin-top:4px}
.note{margin:10px 0 2px;color:var(--acc);font-size:14px;font-style:italic}
.strip{display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden;margin-top:12px}
.strip i{flex:1;display:block}
.card.big .strip{height:10px;border-radius:5px;margin-top:14px}
.rows{margin:12px 0 4px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:86px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;align-items:center}
.row:last-child{border-bottom:0}
.k{color:var(--mut);font-size:12px;letter-spacing:.07em;text-transform:uppercase}
.rv{display:flex;align-items:center;gap:10px;min-width:0}
.th{width:30px;height:30px;border-radius:9px;object-fit:cover;border:1px solid var(--dotb);flex:0 0 auto;display:grid;place-items:center;font-size:17px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;border:1px solid var(--dotb);flex:0 0 auto}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--mut)}
.cf{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.cf .btn{min-height:44px;font-size:14px;padding:8px 6px}
.cf .wide{grid-column:1/4}
.count{color:var(--mut);font-size:13px;margin:16px 2px 8px}
.card.compact{padding:12px 14px;margin-bottom:10px;width:100%;text-align:left;display:block;color:var(--text)}
.card.compact .name{font-size:18px}
.card.compact .strip{margin-top:10px;height:5px}
.brief{color:var(--mut);font-size:13px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.steps{list-style:none;padding:0;margin:12px 0}
.steps li{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:15px}
.steps .ck{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;flex:0 0 auto}
.steps .ok .ck{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.wx{display:block;width:100%;text-align:left;margin:0 0 10px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 14px;font-size:14px;color:var(--text)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{display:grid;grid-template-columns:repeat(4,1fr);max-width:560px;margin:0 auto}
.nav button{background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;min-height:58px;color:var(--mut);font-size:11.5px;font-weight:600}
.nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--acc)}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.tools .btn{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:64px;gap:5px;font-size:12px;padding:8px 2px;line-height:1.15;text-align:center}
.tools .btn svg{width:19px;height:19px}
.tools .btn small{display:block;font-weight:500;color:var(--mut);font-size:11px}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-ink);font-size:32px;line-height:1;box-shadow:var(--shadow);z-index:10}
.ov{position:fixed;inset:0;background:var(--ov);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:560px;max-height:93vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom))}
.sh h2{font-family:var(--serif);font-weight:400;font-size:24px;margin:0 0 6px}
.sh h3{margin:16px 0 6px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:600}
label{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin:12px 0 5px}
input[type=text],input[type=time],input[type=date],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:46px;color:var(--text)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btns.one{grid-template-columns:1fr}
.help{color:var(--mut);font-size:13.5px;margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:80;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.sw{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.sw button{aspect-ratio:1;border-radius:50%;border:2px solid var(--dotb);padding:0}
.sw button.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.colr{display:flex;gap:10px;align-items:center;margin-top:10px}
.colr input[type=color]{width:54px;height:44px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:0;background:transparent;border-radius:10px;min-height:40px;color:var(--mut);font-size:14px;font-weight:600}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.photo{display:flex;gap:12px;align-items:center}
.photo img{width:72px;height:72px;border-radius:14px;object-fit:cover;border:1px solid var(--line)}
.irow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 2px;min-height:58px;color:var(--text)}
.irow .th{width:36px;height:36px}
.il{display:flex;flex-direction:column;flex:1;min-width:0}
.il span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.il em{font-style:normal;color:var(--mut);font-size:12.5px}
.chev{color:var(--mut);font-size:22px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.kpi b{display:block;font-family:var(--serif);font-size:26px;font-weight:400;color:var(--acc);line-height:1.1}
.kpi span{font-size:11.5px;color:var(--mut)}
.hint{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px;line-height:1.45}
.hint b{color:var(--acc);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.cov{padding:6px 0;font-size:14px}
.cov .cl{display:flex;justify-content:space-between}
.sec{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:600;margin:20px 2px 8px}
.set{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px;margin-bottom:10px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.srow:last-child{border-bottom:0}
.srow small{display:block;color:var(--mut);font-size:12.5px}
.sw2{width:50px;height:30px;border-radius:999px;border:1px solid var(--line);background:var(--card2);position:relative;padding:0;flex:0 0 auto}
.sw2:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:.15s}
.sw2.on{background:var(--acc);border-color:var(--acc)}
.sw2.on:after{left:23px;background:var(--acc-ink)}
.link{background:transparent;border:0;color:var(--acc);padding:6px 0;font-weight:600}
.star{border:0;background:transparent;font-size:24px;width:40px;height:40px;color:var(--mut)}
.star.on{color:var(--acc)}
.banner{background:var(--card2);border:1px solid var(--acc);border-radius:14px;padding:12px;margin:0 0 12px;font-size:14px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;color:var(--text)}
.opt.on{border-color:var(--acc)}
.opt b{font-family:var(--serif);font-weight:400;font-size:19px;display:block}
.opt span{color:var(--mut);font-size:13px}
.opt .strip{margin-top:8px;height:5px}
.tday{border-top:1px solid var(--line);padding:10px 0}
.tday:first-of-type{border-top:0}
.tday b{font-family:var(--serif);font-weight:400;font-size:17px}
.tday .wxl{color:var(--mut);font-size:12.5px;margin-left:6px}
.tday .ln{color:var(--mut);font-size:13.5px;margin-top:3px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideup{from{transform:translateY(46px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.97);opacity:.5}60%{transform:scale(1.012)}100%{transform:scale(1);opacity:1}}
@keyframes starpop{0%{transform:scale(1)}40%{transform:scale(1.55) rotate(-14deg)}100%{transform:scale(1)}}
@keyframes check{0%{transform:scale(.92)}55%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.card.pop{animation:pop .38s ease}
.app-in>*{animation:rise .45s ease both}
.app-in>*:nth-child(2){animation-delay:.04s}.app-in>*:nth-child(3){animation-delay:.08s}.app-in>*:nth-child(4){animation-delay:.12s}.app-in>*:nth-child(5){animation-delay:.16s}.app-in>*:nth-child(6){animation-delay:.2s}
.ov:not(.still){animation:fadein .2s ease}
.ov:not(.still) .sh{animation:slideup .3s cubic-bezier(.2,.8,.2,1)}
.btn.pulse{animation:check .36s ease}
.star.pulse{animation:starpop .42s ease}
.toast{animation:toastin .22s ease}
.btn,.chip,.nav button,.irow,.opt{transition:transform .12s ease,background-color .2s ease,border-color .2s ease,color .2s ease}
.btn:active,.chip:active,.nav button:active,.opt:active{transform:scale(.96)}
body{transition:background-color .3s ease,color .3s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wphoto{margin-top:12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.wphoto img{width:100%;max-height:210px;object-fit:cover;border-radius:14px;border:1px solid var(--line);animation:fadein .35s ease}
.fbtn{text-transform:none;letter-spacing:0;font-size:14px;color:var(--text);margin:0;position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
.fbtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0}
.msec{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:600;margin:14px 2px 6px}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dcell{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card2);padding:0;text-align:left;display:block;color:#fff}
.dcell img{width:100%;height:100%;object-fit:cover;display:block;animation:fadein .35s ease}
.dph{position:absolute;inset:0;display:flex;flex-direction:column}
.dph i{flex:1;display:block;opacity:.85}
.dcap{position:absolute;left:0;right:0;bottom:0;padding:18px 7px 6px;background:linear-gradient(transparent,rgba(0,0,0,.72));font-size:11px;line-height:1.2;display:flex;flex-direction:column;gap:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcap b{font-size:12.5px}
.dbig{width:100%;max-height:420px;object-fit:cover;border-radius:14px;border:1px solid var(--line);margin:4px 0 8px;animation:fadein .35s ease}
.rk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.rk:last-of-type{border-bottom:0}
.rn{flex:0 0 28px;height:28px;border-radius:50%;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:2px}
.rk .il{flex:1;min-width:0}
.rk .il>span:first-child{white-space:normal}
.rk .rnote{color:var(--acc);margin-top:4px}
.rbt{display:flex;gap:8px;margin-top:8px;white-space:normal}
.rbar{display:block;height:6px;border-radius:3px;background:var(--card2);margin-top:6px;overflow:hidden}
.rbar b{display:block;height:100%;background:var(--acc);border-radius:3px;animation:grow .7s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fadeout{to{opacity:0}}
@keyframes slidedown{to{transform:translateY(60px);opacity:0}}
.ov.out{animation:fadeout .18s ease forwards!important;pointer-events:none}
.ov.out .sh{animation:slidedown .18s ease forwards!important}
.sh::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--line);margin:-8px auto 12px}
.cshades{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:4px 0 6px}

/* genere e numero per concordare il colore: m/f, p = plurale */

 giacca:'f',blazer:'m',cappotto:'m',piumino:'m',giubbotto:'m',impermeabile:'m',cardigan:'m',sneakers:'fp',eleganti:'fp',mocassini:'mp',stivali:'mp',sportive:'fp',sandali:'mp',sciarpa:'f',cappello:'m',guanti:'mp',cintura:'f'};

 'Verde':['verde','verde','verdi','verdi'],'Giallo':['giallo','gialla','gialli','gialle'],'Arancione':['arancione','arancione','arancioni','arancioni'],'Rosso':['rosso','rossa','rossi','rosse']};
const COLORS=[

 ['Beige','#d8c3a0'],['Cammello','#b98a55'],['Marrone','#6b4a2f'],['Blu navy','#1f2a4d'],['Denim','#4a6a96'],['Blu','#2f5fb3'],
 ['Azzurro','#8fb8e6'],['Turchese','#2aa7a7'],['Verde','#2f7d4f'],['Verde oliva','#6b6b3a'],['Menta','#9fd3b4'],['Giallo','#e8c43a'],
 ['Senape','#c79a2b'],['Arancione','#e07a2f'],['Rosso','#c0392b'],['Bordeaux','#6e1f2e'],['Rosa','#e8a0b4'],['Viola','#6a4c93'],['Lilla','#b8a4d8']
];
const CFAM=[
 ['Neutri',[['Bianco','#fafafa'],['Panna','#f1e8da'],['Avorio','#e9dfc6'],['Grigio perla','#d6d6d6'],['Grigio chiaro','#b4b4b4'],['Grigio medio','#808080'],['Antracite','#3b3f44'],['Nero','#17171a']]],
 ['Beige e terra',[['Sabbia','#dcc9a8'],['Beige','#c9b28f'],['Tortora','#b3a496'],['Talpa','#8b7b6e'],['Cammello','#c19a6b'],['Nocciola','#9a7b5a'],['Cuoio','#8b5a2b'],['Marrone bruciato','#7a4a2a'],['Cioccolato','#5a3d2b'],['Testa di moro','#3b2a20']]],

 ['Verdi',[['Menta','#a8d5ba'],['Salvia','#a3b18a'],['Oliva','#6b6b2f'],['Verde militare','#4b5320'],['Verde bosco','#2d4a35'],['Verde bottiglia','#1f3d2b'],['Smeraldo','#1f7a5c']]],
 ['Rossi',[['Corallo','#e5674f'],['Rosso','#c0262d'],['Rosso mattone','#a23b2a'],['Rosso scuro','#7a1d1d'],['Bordeaux','#5e1a2b']]],
 ['Rosa e viola',[['Rosa cipria','#e6c2c0'],['Rosa','#f0a8b8'],['Rosa antico','#c9959b'],['Salmone','#f4a08a'],['Fucsia','#c2185b'],['Lavanda','#c3b5e0'],['Viola','#6b3fa0'],['Melanzana','#3d1f45']]],

];
function cdist(a,b){const x=hex2rgb(a),y=hex2rgb(b);return Math.sqrt((x[0]-y[0])*(x[0]-y[0])*.3+(x[1]-y[1])*(x[1]-y[1])*.55+(x[2]-y[2])*(x[2]-y[2])*.15);}
function colorFine(hex){let best='',bd=1e9;CFAM.forEach(f=>f[1].forEach(c=>{const d=cdist(hex,c[1]);if(d<bd){bd=d;best=c[0];}}));return best;}
function famOf(hex){let bi=0,bd=1e9;CFAM.forEach((f,i)=>f[1].forEach(c=>{const d=cdist(hex,c[1]);if(d<bd){bd=d;bi=i;}}));return bi;}
const OCCS=[['casual','Casual',1],['smart','Smart',2],['elegante','Elegante',3],['sport','Sport',0]];

/* ===================== COLORI ===================== */
function hex2rgb(h){h=String(h||'#888888').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16)||0;return [(n>>16)&255,(n>>8)&255,n&255];}
const _ci={};
function cinfo(hex){
 hex=String(hex||'#888888').toLowerCase();
 if(_ci[hex])return _ci[hex];
 const rgb=hex2rgb(hex),r=rgb[0]/255,g=rgb[1]/255,b=rgb[2]/255;
 const mx=Math.max(r,g,b),mn=Math.min(r,g,b),C=mx-mn,l=(mx+mn)/2;
 let h=0;
 if(C>0){if(mx===r)h=((g-b)/C)%6;else if(mx===g)h=(b-r)/C+2;else h=(r-g)/C+4;h*=60;if(h<0)h+=360;}
 const lin=v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);
 const y=.2126*lin(r)+.7152*lin(g)+.0722*lin(b);
 const earth=h>=15&&h<=65&&C>=.12&&C<.55&&(mx-mn)/(1-Math.abs(2*l-1)||1)<.75;
 let cls;
 if(C<.12||l<.2||l>.9||earth)cls='N';else if(C<.40)cls='M';else cls='V';
 return (_ci[hex]={h:h,c:C,l:l,y:y,cls:cls,dark:y<.07});
}
function colorName(hex){
 const a=hex2rgb(hex);let best=null,bd=1e9;
 COLORS.forEach(c=>{const b=hex2rgb(c[1]);const d=(a[0]-b[0])*(a[0]-b[0])*.3+(a[1]-b[1])*(a[1]-b[1])*.55+(a[2]-b[2])*(a[2]-b[2])*.15;if(d<bd){bd=d;best=c[0];}});
 return best;
}
function hueDiff(a,b){const d=Math.abs(a.h-b.h);return d>180?360-d:d;}
function pairScore(a,b){
 const A=a.cls,B=b.cls;
 if(A==='N'&&B==='N')return (a.dark&&b.dark)?6:8;
 if(A==='N'||B==='N')return (A==='V'||B==='V')?7:9;
 const d=hueDiff(a,b);
 if(A==='M'&&B==='M'){if(d<40)return 6;if(d>=150)return 4;if(d>=70&&d<=140)return -4;return 0;}
 if(d<30)return A===B?2:4;
 if(d>=160)return -2;
 return (A==='V'&&B==='V')?-18:-10;
}

/* ===================== UTILITA' ===================== */
function hashStr(s){let h=7;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}
function pad(n){return n<10?'0'+n:''+n;}
function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function today(){return fmtDate(new Date());}
function daysBetween(a,b){const x=a.split('-'),y=b.split('-');return Math.round((Date.UTC(+y[0],+y[1]-1,+y[2])-Date.UTC(+x[0],+x[1]-1,+x[2]))/864e5);}
function itemW(it){const s=SUB[it.sub]||{w:0};return (it.w!=null?it.w:s.w)*(1+.3*(it.wt||0));}
function itemF(it){const s=SUB[it.sub]||{f:1};return it.f!=null?it.f:s.f;}
function colorAgree(hex,sub){
 const nm=colorFine(hex),g=GEN[sub]||'m',f=FORMS[nm];
 if(!f)return nm.toLowerCase();
 return f[(g.indexOf('p')>-1?2:0)+(g.charAt(0)==='f'?1:0)];
}
function itemName(it){const s=SUB[it.sub]||{l:'Capo'};return it.n&&it.n.trim()?it.n.trim():s.l+' '+colorAgree(it.color,it.sub);}
function itemCat(it){return (SUB[it.sub]||{cat:'top'}).cat;}
function targetI(T){return Math.max(.8,Math.min(8,.8+(28-T)*.17));}
function outfitKey(P){return [P.dress,P.top,P.bottom,P.outer].filter(Boolean).map(x=>x.id).sort().join('|');}

/* ===================== MOTORE ===================== */
/* ctx: {T, rain, occ, noDark, seed, last:{id:giorni}, like:{key:1}, dis:{key:1}, relax} */
function okItem(it,ctx){
 const s=SUB[it.sub];if(!s)return false;
 if(ctx.relax||ctx.T==null)return true;
 if(s.minT!=null&&ctx.T<s.minT)return false;
 if(s.maxT!=null&&ctx.T>s.maxT)return false;
 return true;
}
function bodyScore(top,bottom,dress){
 if(dress)return 0;
 let s=pairScore(top._c,bottom._c)*2;
 const dl=Math.abs(top._c.l-bottom._c.l);
 if(dl>=.3)s+=4;
 if(top.pat&&bottom.pat)s-=18;
 s-=Math.abs(itemF(top)-itemF(bottom))*7;
 return s;
}
function evalOutfit(P,ctx,occT){
 let s=50;const why=[];
 const T1=P.dress||P.top,B1=P.dress||P.bottom,O=P.outer,Sh=P.shoes;
 /* regola: niente outfit tutto scuro */
 if(!P.dress&&T1._c.dark&&B1._c.dark){if(ctx.noDark&&!ctx.relax)return null;s-=30;}
 if(O&&O._c.dark&&T1._c.dark){if(ctx.noDark&&!ctx.relax)return null;s-=22;}
 /* colori */
 const pr=[];
 if(!P.dress)pr.push([T1,B1,1]);
 if(O){pr.push([T1,O,.8]);if(!P.dress)pr.push([B1,O,.5]);}
 pr.push([B1,Sh,.5]);if(!P.dress)pr.push([T1,Sh,.2]);if(O)pr.push([O,Sh,.2]);
 let cs=0,ws=0;pr.forEach(p=>{cs+=pairScore(p[0]._c,p[1]._c)*p[2];ws+=p[2];});
 cs=cs/ws;s+=cs*2;
 const vis=[T1,B1,O].filter(Boolean);
 const accents=vis.filter(x=>x._c.cls!=='N');
 const hues=[];accents.forEach(x=>{if(!hues.some(h=>Math.abs(h-x._c.h)<30))hues.push(x._c.h);});
 if(hues.length>2)s-=12;
 if(accents.length===1&&vis.length>1){s+=5;why.push('Tocco di colore: '+colorName(accents[0].color).toLowerCase());}
 else if(cs>=6)why.push('Colori ben bilanciati');
 if(!P.dress){const dl=Math.abs(T1._c.l-B1._c.l);if(dl>=.3)s+=5;else if(dl<.08&&T1._c.cls==='N'&&B1._c.cls==='N'&&!(T1._c.dark&&B1._c.dark))s-=3;}
 const npat=vis.filter(x=>x.pat).length;
 if(npat>=2)s-=16;else if(npat===1&&accents.some(x=>!x.pat&&x._c.cls==='V'))s-=6;
 /* formalità */
 const fs=[itemF(T1),itemF(B1),itemF(Sh)];if(O)fs.push(itemF(O));
 if(P.dress){fs.push(itemF(P.dress));}
 const avg=fs.reduce((a,b)=>a+b,0)/fs.length,spread=Math.max.apply(null,fs)-Math.min.apply(null,fs);
 const dv=Math.abs(avg-occT);
 if(!ctx.relax){if(dv>1.3||spread>2.1)return null;if(ctx.occ==='sport'&&itemF(Sh)>.8)return null;}
 s-=dv*22+spread*9;
 /* meteo */
 let I=itemW(T1)+(P.dress?0:itemW(B1))+(O?itemW(O):0);
 (P.acc||[]).forEach(a=>{I+=itemW(a);});
 if(ctx.T!=null){
  const delta=I-targetI(ctx.T);
  s-=Math.min(36,Math.abs(delta)*15);
  if(Math.abs(delta)<.8)why.push('Pesantezza giusta per '+Math.round(ctx.T)+'°');
  else if(delta<-1.5&&!O&&ctx.T<12)why.push('Un po\' leggero: aggiungi una giacca');
  if(ctx.T<12&&!O){if(ctx.T<6&&!ctx.relax)return null;s-=22;}
  if(ctx.T>=24&&O&&!(ctx.rain&&(O.wp||(SUB[O.sub]||{}).wp)))s-=10;
 }
 if(ctx.rain){
  if(Sh.fr||(SUB[Sh.sub]||{}).id==='sandali')s-=22;
  if(O&&(O.wp||(SUB[O.sub]||{}).wp)){s+=8;why.push('Impermeabile per la pioggia');}
  const seenR={};
  [T1,B1,O].forEach(x=>{if(x&&!seenR[x.id]&&x.fr&&!(x.wp||(SUB[x.sub]||{}).wp)){seenR[x.id]=1;s-=24;why.push('Attenzione: '+itemName(x).toLowerCase()+' è delicato con la pioggia');}});
 }
 /* freschezza e preferenze */
 const L=ctx.last||{};
 [[T1,1],[P.dress?null:B1,.35],[O,.2],[Sh,.25]].forEach(p=>{
  const it=p[0];if(!it)return;
  const d=L[it.id];
  if(d==null){if(p[1]>=.35){s+=1.5;}}
  else if(d<=1)s-=9*p[1];else if(d<=3)s-=4*p[1];
  else if(d>=14&&p[1]>=1){s+=2;why.push('Non lo metti da '+d+' giorni: '+itemName(it).toLowerCase());}
 });
 let favN=0;[T1,B1,O,Sh].forEach(x=>{if(x&&x.fav)favN++;});
 if(favN){s+=Math.min(8,favN*3);why.push('Include un tuo capo preferito');}
 const key=outfitKey(P);
 if(ctx.like&&ctx.like[key]){s+=14;why.push('Ti era piaciuto');}
 s+=(hashStr(ctx.seed+'|'+key+'|'+(Sh.id))%100)/100*7;
 return {score:s,why:why.slice(0,3),I:I};
}
function pickAcc(P,items,ctx){
 const out=[],T=ctx.T;
 const best=(sub)=>{
  const c=items.filter(i=>i.sub===sub);if(!c.length)return null;
  let b=null,bs=-1e9;
  c.forEach(a=>{
   let s=0;[P.outer,P.top,P.dress].filter(Boolean).forEach(x=>{s+=pairScore(a._c,x._c);});
   if(a.fav)s+=2;s+=(hashStr(ctx.seed+a.id)%10)/10;
   if(s>bs){bs=s;b=a;}
  });return b;
 };
 if(T!=null){
  if(T<9){const x=best('sciarpa');if(x)out.push(x);}
  if(T<3){const g=best('guanti');if(g)out.push(g);}
  if(T<5){const c=best('cappello');if(c)out.push(c);}
 }
 const bsub=P.bottom&&['jeans','chino','pantaloni'].indexOf(P.bottom.sub)>-1;
 if(bsub&&itemF(P.bottom)>=1){
  const belts=items.filter(i=>i.sub==='cintura');
  if(belts.length){
   let b=null,bs=-1e9;
   belts.forEach(x=>{
    let s=-Math.abs(x._c.l-P.shoes._c.l)*10-(x._c.cls==='V'?5:0);
    if(x._c.cls!=='N'&&P.shoes._c.cls==='N')s-=3;
    if(s>bs){bs=s;b=x;}
   });
   if(b)out.push(b);
  }
 }
 return out;
}
function suggest(items,ctx,n){
 n=n||8;
 items.forEach(it=>{it._c=cinfo(it.color);});
 const occRow=OCCS.filter(o=>o[0]===ctx.occ)[0]||OCCS[0],occT=occRow[2];
 const by=c=>items.filter(i=>itemCat(i)===c&&okItem(i,ctx));
 const tops=by('top'),bots=by('bottom'),dres=by('dress'),outs=by('outer'),shs=by('shoes');
 if(!shs.length||(!dres.length&&(!tops.length||!bots.length)))return [];
 const bodies=[];
 tops.forEach(t=>bots.forEach(b=>bodies.push({top:t,bottom:b,s:bodyScore(t,b)})));
 dres.forEach(d=>bodies.push({dress:d,s:0}));
 bodies.sort((a,b)=>b.s-a.s);
 const B=bodies.slice(0,150);
 const res=[];
 const noOuter=[null].concat(outs);
 B.forEach(bd=>{
  noOuter.forEach(o=>{
   const f0=bd.dress?itemF(bd.dress):(itemF(bd.top)+itemF(bd.bottom))/2;
   const bsub=bd.dress||bd.bottom;
   const cand=shs.map(sh=>({sh:sh,c:-Math.abs(itemF(sh)-f0)*5+pairScore(bsub._c,sh._c)*.6+(sh.fav?1:0)}))
    .sort((a,b)=>b.c-a.c).slice(0,4);
   cand.forEach(cd=>{
    const sh=cd.sh;
    const P={top:bd.top,bottom:bd.bottom,dress:bd.dress,outer:o,shoes:sh,acc:[]};
    const key=outfitKey(P);

function moodWord(ctx){

 if(ctx.occ==='sport')return 'Active';
 if(ctx.occ==='elegante')return 'Evening';

}

 vis.slice().sort((a,b)=>rank[a._c.cls]-rank[b._c.cls]).forEach(it=>{const w=CWORD[colorName(it.color)]||'Classic';if(words.indexOf(w)<0)words.push(w);});

 const main=P.outer||P.top||P.dress,piece=PIECEW[main.sub]||'Look';

function briefOutfit(P){return [P.dress,P.top,P.bottom,P.outer,P.shoes].filter(Boolean).map(itemName).join(' · ');}
function scheduleMorning(test){
 const LN=plug('LocalNotifications');
 if(!LN||!isNative())return;
 const n=meta.notif,ev=n.ev||{on:false,h:21,m:0};
 const idsN=[9001,9002,9003,9004,9005,9006,9007,9011,9012,9013,9014,9015,9016,9017,9098,9099];
 const cancel=()=>{try{return LN.cancel({notifications:idsN.map(i=>({id:i}))});}catch(e){return Promise.resolve();}};
 if(!test&&!n.on&&!ev.on){cancel();return;}
 const doIt=()=>Promise.resolve(LN.requestPermissions()).then(p=>{
  if(!p||p.display!=='granted'){toast('Notifiche non consentite dal telefono');return;}
  try{LN.createChannel({id:'outfit',name:'Outfit del giorno',importance:3,visibility:1});}catch(e){}
  return Promise.resolve(cancel()).then(()=>{
   const list=[],now=new Date();
   const wxt=s=>s.c.info?' · '+Math.round(s.c.info.d.tmin)+'–'+Math.round(s.c.info.d.tmax)+'°'+(s.c.rain?' · pioggia':''):'';
   if(test){
    const s=bestFor(test==='e'?1:0);
    if(s)list.push({id:test==='e'?9098:9099,title:test==='e'?'Outfit di domani'+wxt(s):'Outfit di oggi'+wxt(s),body:briefOutfit(s.r.P),channelId:'outfit',extra:{d:s.c.ds},schedule:{at:new Date(Date.now()+4000),allowWhileIdle:true}});
   }else{
    for(let i=0;i<7;i++){
     if(n.on){
      const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i,n.h,n.m,0);
      if(d.getTime()>Date.now()){const s=bestFor(i);if(s)list.push({id:9001+i,title:'Outfit di oggi'+wxt(s),body:briefOutfit(s.r.P),channelId:'outfit',extra:{d:s.c.ds},schedule:{at:d,allowWhileIdle:true}});}
     }
     if(ev.on){
      const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i,ev.h,ev.m,0);
      if(d.getTime()>Date.now()){const s=bestFor(i+1);if(s)list.push({id:9011+i,title:'Outfit di domani'+wxt(s),body:briefOutfit(s.r.P),channelId:'outfit',extra:{d:s.c.ds},schedule:{at:d,allowWhileIdle:true}});}
     }
    }
   }
   if(list.length)return LN.schedule({notifications:list}).then(()=>{if(test)toast('Notifica di prova tra pochi secondi');});
   if(test)toast('Aggiungi prima qualche capo');
  });
 }).catch(()=>{toast('Notifiche non disponibili');});
 doIt();
}

function downloadBackup(){

 l.href=URL.createObjectURL(b);l.download='cosaindosso-backup-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();

function shareBackup(){

function hasWork(){return data.items.some(i=>!i.demo)||data.log.length>=3||data.bags.length>0||data.watches.length>0;}
function autoBackup(force){
 const FS=plug('Filesystem');
 if(!isNative()||!FS)return;
 if(!force){
  if(meta.ab===false||!hasWork())return;
  if(meta.abLast&&daysSince(meta.abLast)<7)return;
 }
 const ok=()=>{meta.abLast=today();meta.abErr='';meta.lb=today();saveMeta();if(force){toast('Backup salvato in Documenti/CosaIndosso');render();}};
 const ko=e=>{meta.abErr=String((e&&e.message)||e||'errore').slice(0,140);saveMeta();if(force){toast('Backup automatico non riuscito');render();}};
 const go=()=>{
  try{FS.writeFile({path:'CosaIndosso/cosaindosso-backup.json',data:exportJson(),directory:'DOCUMENTS',encoding:'utf8',recursive:true}).then(ok,ko);}catch(e){ko(e);}
 };
 try{if(FS.requestPermissions){Promise.resolve(FS.requestPermissions()).then(go,go);}else go();}catch(e){go();}

 data.items=o.items;data.log=o.log||[];data.saved=o.saved||[];data.like=o.like||{};data.dis=o.dis||{};data.bags=o.bags||[];data.watches=o.watches||[];data.perf=o.perf||[];data.pwish=o.pwish||[];data.wish=o.wish||[];

function forgottenList(){
 const last={};data.log.forEach(e=>e.ids.forEach(id=>{if(!last[id]||e.d>last[id])last[id]=e.d;}));
 const out=[];
 data.items.forEach(it=>{
  if(itemCat(it)==='acc'||it.wash)return;
  const l=last[it.id];
  if(l){const d=daysSince(l);if(d>=45)out.push({it:it,d:d});}
  else{const age=it.t?Math.floor((Date.now()-it.t)/864e5):99;if(age>=30)out.push({it:it,d:null});}
 });
 out.sort((a,b)=>(a.d==null?1e6:a.d)>(b.d==null?1e6:b.d)?-1:1);
 return out;
}

/* ---- valigia ---- */
function fetchTrip(st){
 if(!meta.city){st.msg='Imposta prima la città dal meteo (serve per le previsioni).';render();return;}
 const n=st.a&&st.b?daysBetween(st.a,st.b)+1:0;
 if(n<1){st.msg='Controlla le date: la fine deve essere dopo l\'inizio.';render();return;}
 if(n>14){st.msg='Al massimo 14 giorni.';render();return;}
 if(daysBetween(today(),st.a)<0||daysBetween(today(),st.b)>15){st.msg='Le previsioni arrivano ai prossimi 15 giorni.';render();return;}
 st.msg='Carico il meteo…';st.plan=null;render();
 const u='https://api.open-meteo.com/v1/forecast?latitude='+meta.city.lat+'&longitude='+meta.city.lon+'&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_probability_max,precipitation_sum&timezone=auto&start_date='+st.a+'&end_date='+st.b;
 fetch(u).then(r=>{if(!r.ok)throw new Error('http');return r.json();}).then(j=>{
  const d=j.daily;
  const days=d.time.map((x,i)=>({d:x,c:d.weather_code[i],tmax:d.temperature_2m_max[i],tmin:d.temperature_2m_min[i],fmax:d.apparent_temperature_max[i],fmin:d.apparent_temperature_min[i],pp:d.precipitation_probability_max[i]||0,ps:d.precipitation_sum[i]||0}));
  st.plan=planTrip(days);st.msg='';render();
 }).catch(()=>{st.msg='Meteo non disponibile: serve internet.';render();});
}
function planTrip(days){
 const used={},times={},out=[];
 days.forEach(day=>{
  const c={T:.4*day.fmin+.6*day.fmax,rain:(day.pp>=50||day.ps>=1),occ:meta.occ,noDark:meta.noDark,seed:day.d,last:{},like:data.like,dis:data.dis,relax:false,ds:day.d};
  const L=suggestWithFallback(avail(),c,8).list;
  let best=null,bv=-1e9;
  L.forEach(r=>{
   let v=r.score/10,nw=0;
   ids(r.P).forEach(id=>{if(used[id])v+=2;else nw++;});
   v-=nw*1.4;v-=(times[r.key]||0)*3;
   if(v>bv){bv=v;best=r;}
  });
  if(best){ids(best.P).forEach(id=>{used[id]=(used[id]||0)+1;});times[best.key]=(times[best.key]||0)+1;const n=nameOutfit(best.P,c);best=Object.assign({},best,{name:n.name});}
  out.push({day:day,r:best,rain:c.rain});
 });
 const byId={};data.items.forEach(i=>{byId[i.id]=i;});
 const pack=Object.keys(used).map(id=>byId[id]).filter(Boolean);
 return {days:out,pack:pack,used:used,rain:out.some(x=>x.rain)};
}

function drawDrop(){
 const cv=document.querySelector('.pcv');if(!cv||!DROPIMG)return;
 const k=Math.min(1,520/Math.max(DROPIMG.width,DROPIMG.height));
 cv.width=Math.round(DROPIMG.width*k);cv.height=Math.round(DROPIMG.height*k);
 cv.getContext('2d').drawImage(DROPIMG,0,0,cv.width,cv.height);
}
function dropSample(cv,ev){
 const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)*cv.width/r.width,y=(ev.clientY-r.top)*cv.height/r.height;
 const R=Math.max(3,Math.round(cv.width/70)),c=cv.getContext('2d');
 const x0=Math.max(0,Math.round(x-R)),y0=Math.max(0,Math.round(y-R)),w=Math.max(1,Math.min(cv.width-x0,R*2+1)),h=Math.max(1,Math.min(cv.height-y0,R*2+1));
 let px;try{px=c.getImageData(x0,y0,w,h).data;}catch(e){return null;}
 let rr=0,g=0,b=0,n=0;for(let i=0;i<px.length;i+=4){rr+=px[i];g+=px[i+1];b+=px[i+2];n++;}
 const hx=v=>('0'+Math.round(v/n).toString(16)).slice(-2);
 const hex='#'+hx(rr)+hx(g)+hx(b);
 c.drawImage(DROPIMG,0,0,cv.width,cv.height);
 c.lineWidth=Math.max(2,R/2);c.strokeStyle='#fff';c.beginPath();c.arc(x,y,R*1.8,0,7);c.stroke();
 c.strokeStyle='#000';c.lineWidth=Math.max(1,R/4);c.beginPath();c.arc(x,y,R*1.8+Math.max(2,R/2),0,7);c.stroke();
 return hex;
}
function dropApply(cv,ev){
 const st=S.sheet;if(!st||!st.d)return;
 const hex=dropSample(cv,ev);if(!hex)return;
 st.d.color=hex;st.d.colorAuto=false;
 const nm=document.getElementById('pcname');if(nm)nm.textContent='Colore scelto: '+hex.toUpperCase()+' · più vicino a «'+colorFine(hex)+'»';
 const ci=document.getElementById('pcolor');if(ci)ci.value=hex;
}

  sh=x;y0=e.touches[0].clientY;dy=0;
 },{passive:true});
 document.addEventListener('touchmove',e=>{
  if(y0===null||!sh)return;
  dy=e.touches[0].clientY-y0;
  if(dy>0&&sh.scrollTop<=0){sh.style.transition='none';sh.style.transform='translateY('+Math.min(dy,300)+'px)';}
 },{passive:true});
 document.addEventListener('touchend',()=>{
  if(y0===null||!sh)return;

  if(dy>110){closeSheet();}else{x.style.transform='';}
  dy=0;
 },{passive:true});
})();

   const c=bf.c,r=bf.r;
   const P=r.P,n=r.worn?{name:r.name}:nameOutfit(P,c),inf=c.info;
   let sub=inf?wxIcon(inf.d.c)+' '+Math.round(inf.d.tmin)+'–'+Math.round(inf.d.tmax)+'°'+(c.rain?' · pioggia '+Math.round(inf.d.pp)+'%':''):'';
   if(r.worn)sub='✓ Indossato oggi'+(sub?' · '+sub:'');
   const ln=[['Sopra',P.dress||P.top],['Sotto',P.bottom],['Sopra tutto',P.outer],['Scarpe',P.shoes]].filter(x=>x[1]).map(x=>x[0]+': '+itemName(x[1]));
   list.push({d:c.ds,oid:r.key,name:n.name,sub:sub,lines:ln.join('\n'),c:[P.dress||P.top,P.bottom,P.outer,P.shoes].filter(Boolean).map(it=>it.color)});
  }
  const th=resolvedTheme(),se=curSeason(),pl=WPAL[th][se];
  W.update({json:JSON.stringify({v:2,th:th,se:se,acc:pl[2],tx:pl[3],mut:pl[4],days:list})});
 }catch(e){}
}
function openDay(ds){
 let off=0;
 if(ds){off=daysBetween(today(),ds);if(!(off>=0&&off<=6))off=0;}
 S.tab='oggi';S.off=off;S.idx=0;S.pin=null;S.sheet=null;S.pop=true;window.scrollTo(0,0);render();
}
function hookNative(){
 const W=plug('WidgetBridge');
 if(W&&W.addListener){try{W.addListener('widgetOpened',ev=>{openDay(ev&&ev.d);});}catch(e){}}
 const LN=plug('LocalNotifications');
 if(LN&&LN.addListener){try{LN.addListener('localNotificationActionPerformed',ev=>{const x=ev&&ev.notification&&ev.notification.extra;openDay(x&&x.d);});}catch(e){}}
 const A=plug('App');
 if(A&&A.addListener){try{A.addListener('appStateChange',st=>{if(st&&st.isActive){applyTheme();if(meta.city)fetchWeather(false,ok=>{if(ok){S.sc=null;render();}});}else{pushWidget();autoBackup(false);}});}catch(e){}}
 try{window.matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if((meta.theme||'dark')==='auto'){render();pushWidget();}});}catch(e){}
}

/* ===================== AVVIO ===================== */
function backBtn(){
 const A=plug('App');if(!A)return;
 try{A.addListener('backButton',()=>{
  if(S.sheet){closeSheet();}
  else if(S.tab!=='oggi'){S.tab='oggi';render();}
  else{try{A.exitApp();}catch(e){}}
 });}catch(e){}
}
function start(){
 load();
 loadPhotos(()=>{
  render();
  backBtn();hookNative();setTimeout(pushWidget,900);setTimeout(()=>autoBackup(false),4000);
  if(meta.city)fetchWeather(false,ok=>{if(ok){S.sc=null;render();scheduleMorning();}});
 });
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)applyTheme();if(!document.hidden&&meta.city)fetchWeather(false,ok=>{if(ok){S.sc=null;render();}});});

start();
})();
</script>
